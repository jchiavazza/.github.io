<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9x19 Shooting - Tiro Deportivo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 30px;
            border: 2px solid #ff4500;
            border-radius: 12px;
            background-color: #1e1e1e;
            box-shadow: 0px 0px 25px rgba(255, 69, 0, 0.35);
        }
        h1 {
            color: #ff4500;
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #cccccc;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #ff4500;
            color: #fff;
            padding: 6px 18px;
            font-weight: bold;
            border-radius: 20px;
            margin-top: 20px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>9x19 Shooting</h1>
        <p>Espacio dedicado al tiro deportivo, precisión, balística y entrenamiento técnico.</p>
        <p>Estamos armando nuestra nueva plataforma web para traerte el mejor contenido, reseñas e información del sector.</p>
        <div class="badge">SITIO EN CONSTRUCCIÓN</div>
    </div>

</body>
</html>
